services:
  postgres:
    image: postgres:16
    container_name: jobtracker-db
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      # Persist data between container restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtracker-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=jobtracker;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: "jobtracker-api"
      Jwt__Audience: "jobtracker-client"
      Jwt__ExpiryMinutes: "60"
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__From: "JobTracker <noreply@jobtracker.local>"
      App__FrontendUrl: "http://localhost:4200"
    ports:
      - "5223:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobtracker-frontend
    ports:
      - "4200:80"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit
    container_name: jobtracker-mail
    ports:
      - "8025:8025"   # web inbox
      - "1025:1025"   # SMTP

volumes:
  postgres_data: